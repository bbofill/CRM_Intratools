<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>CRMIntratools - Room reservation</title>
  <link rel="stylesheet" href="/assets/css/bootstrap.min.css?v={{.AppVersion}}"> 
  <link rel="stylesheet" href="assets/style.css?v={{.AppVersion}}">
  <link rel="shortcut icon" href="/assets/images/headerLogo.png" />
</head>

<body>
  <!-- HEADER -->
<header class="bg-light">
  <div class="container d-flex justify-content-between align-items-center">
    <a href="/main">
      <img id="logo" src="assets/images/logo.png" alt="Logo CRMIntratools" >
    </a>
          <div class="d-flex align-items-center gap-4 ms-3">
        <a href="/module/gui/module3/notifications.html" class="position-relative">
          <img src="/assets/images/bell.png" alt="Notifications" style="width: 30px;">
          <span id="notif-count"
                class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
          </span>
        </a>
    <a href="index.html" class="btn btn-outline-secondary">← Go back</a>
  </div>
  </div>
</header>
<div id="page-container">
    <div class="container">
        <h2 class="text-danger">Modify Your Reservations</h2>
        <p>Here are your upcoming reservations. Click "Cancel" on the one you wish to cancel.</p>
        <div class="table-responsive">
          <table class="table table-hover text-center align-middle">
            <thead class="table-danger">
              <tr>
                <th>Room ID</th>
                <th>Room name</th>
                <th>Concept</th>
                <th>Start Time</th>
                <th>End Time</th>
                <th>Email</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="reservationTableBody" class="table-active">
              <tr><td colspan="7">Loading...</td></tr>
            </tbody>
          </table>
        </div>
    </div>

    <script>
      //get reservations made by user accessing
      async function fetchReservations() {
        const response = await fetch("/module/proxy/module1/api?action=fetchMyReservations", {
          method: "GET",
          headers: { "Content-Type": "application/json" }
        });

        const tbody = document.getElementById("reservationTableBody");
        tbody.innerHTML = "";
        if (!response.ok) {
          tbody.innerHTML = `<tr><td colspan='7'>Unable to load reservations.</td></tr>`;
          return;
        }
        const reservations = await response.json();
        if (!Array.isArray(reservations) || reservations.length === 0) {
          tbody.innerHTML = `<tr><td colspan='7'>No upcoming reservations found.</td></tr>`;
          return;
        }
        function formatDateTime(isoString) {
          const [datePart, timePart] = isoString.split("T");
          const [year, month, day] = datePart.split("-");
          const [hour, minute] = timePart.split(":");
          return `${day}-${month}-${year} ${hour}:${minute}`;
        }
        // read and show reservations
        reservations.forEach(res => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${res.room_id}</td>
            <td>${res.name}</td>
            <td>${res.concept}</td>
            <td>${formatDateTime(res.start_date)}</td>
            <td>${formatDateTime(res.end_date)}</td>
            <td>${res.email}</td>
            <td><button class="btn btn-outline-danger")'>Cancel reservation</button></td>
      `;
      //delete reservation if cancelbutton clicked
      const cancelBtn = row.querySelector("button");
      cancelBtn.addEventListener("click", async () => {
      if (!confirm("Are you sure you want to cancel this reservation?")) return;

      const response = await fetch("/module/proxy/module1/api", {
        method: "DELETE",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: res.id })
      });

      if (response.ok) {
        alert("Reservation cancelled.");
        fetchReservations();
      } else {
        alert("Error cancelling reservation.");
      }  });
            tbody.appendChild(row);
          });
        }
  
      window.addEventListener("DOMContentLoaded", fetchReservations);
    </script>
</div>
  <!-- FOOTER -->
  <footer class="bg-danger text-light py-3 mt-4">
    <div class="container d-flex justify-content-between align-items-center small">
      <span>&copy; 2026 - <a class="text-white text-decoration-none" href="https://www.crm.cat">Centre de Recerca Matemàtica</a></span>
      <span id="load-info">Calculating load time...</span>
    </div>

    <script type="module">
      import { measurePageLoadTime } from '/assets/js/checkLoadTime.js?v={{.AppVersion}}';
      
      measurePageLoadTime({
        targetId: 'load-info',
        precision: 6,
      onComplete: (time) => console.log("Load Time:", time + "s")
      });
    </script>
  </footer>
<script type="module">
  import { initNotificationBadge } from "/assets/js/notificationUtils.js?v={{.AppVersion}}";
  initNotificationBadge();
</script>
</body>

</html>
