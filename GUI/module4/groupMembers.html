<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CRMIntratools - Group Members</title>
  <link rel="stylesheet" href="/assets/css/bootstrap.min.css?v={{.AppVersion}}"> 
  <link rel="stylesheet" href="assets/style.css?v={{.AppVersion}}">
  <link rel="shortcut icon" href="/assets/images/headerLogo.png" />
  <style>
    .modal-body {
      max-height: 70vh;
      overflow-y: auto;
    }
  </style>
</head>

<body>
<!-- HEADER -->
<header class="bg-light">
  <div class="container d-flex justify-content-between align-items-center">
    <a href="/main">
      <img id="logo" src="assets/images/logo.png" alt="Logo CRMIntratools">
    </a>
          <div class="d-flex align-items-center gap-4 ms-3">
        <a href="/module/gui/module3/notifications.html" class="position-relative">
          <img src="/assets/images/bell.png" alt="Notifications" style="width: 30px;">
          <span id="notif-count"
                class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
          </span>
        </a>
    <a href="groups.html" class="btn btn-outline-secondary">← Go back</a>
  </div>
  </div>
</header>

<div id="page-container">
  <div>
    <main class="container">
      <h2 id="groupHubTitle">Groups Hub</h2>
      <div class="d-flex justify-content-end mb-3">
        <button id="openAddUserModalBtn" class="btn btn-success">
          + Add Member
        </button>
      </div>
      <div id="user-list" class="row row-cols-1 row-cols-md-2 g-4 mt-3"></div>
    </main>
  </div>
</div>

<!-- Modal Edit Member -->
<div class="modal fade" id="editGroupInfoModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header bg-dark text-white">
        <h5 class="modal-title">Edit Group Member</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <form id="groupInfoForm" novalidate>
        <div class="modal-body row g-3">
          <input type="hidden" id="groupUserId" name="people_id">
          <input type="hidden" id="groupCode">

          <div class="col-md-6">
            <label for="groupStartDate" class="form-label">Start Date</label>
            <input type="date" class="form-control" id="groupStartDate">
          </div>
          <div class="col-md-6">
            <label for="groupEndDate" class="form-label">End Date</label>
            <input type="date" class="form-control" id="groupEndDate">
          </div>
          <div class="col-12 form-check">
            <input class="form-check-input" type="checkbox" id="groupIp">
            <label class="form-check-label" for="groupIp">Principal Investigator</label>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Modal Add Member -->
<div class="modal fade" id="addUserToGroupModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header bg-dark text-white">
        <h5 class="modal-title">Add Member to Group</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <form id="addUserToGroupForm" novalidate>
        <div class="modal-body row g-3">
          <div class="col-12">
            <label for="newUserInput" class="form-label">User</label>
            <input list="userOptions" class="form-control" id="newUserInput" placeholder="Type user name...">
            <datalist id="userOptions"></datalist>
            <input type="hidden" id="newUserId">
            <input type="hidden" id="newUserName">
            <input type="hidden" id="newUserSurname">
          </div>
          <div class="col-md-6">
            <label for="newGroupStartDate" class="form-label">Start Date</label>
            <input type="date" class="form-control" id="newGroupStartDate">
          </div>
          <div class="col-md-6">
            <label for="newGroupEndDate" class="form-label">End Date</label>
            <input type="date" class="form-control" id="newGroupEndDate">
          </div>
          <div class="col-12 form-check">
            <input class="form-check-input" type="checkbox" id="newGroupIp">
            <label class="form-check-label" for="newGroupIp">Principal Investigator</label>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Add Member</button>
        </div>
      </form>
    </div>
  </div>
</div>
<script>
    window.APP_VERSION = "{{.AppVersion}}";
</script>
<script src="/assets/js/bootstrap.bundle.min.js?v={{.AppVersion}}"></script>
<script type="module" src="./assets/js/groupMembers.js?v={{.AppVersion}}"></script>

<!-- Footer -->
<footer class="bg-danger text-light py-3 mt-4">
  <div class="container d-flex justify-content-between align-items-center small">
    <span>&copy; 2026 - <a class="text-white text-decoration-none" href="https://www.crm.cat">Centre de Recerca Matemàtica</a></span>
    <span id="load-info">Calculating load time...</span>
  </div>
  <script type="module">
    import { measurePageLoadTime } from '/assets/js/checkLoadTime.js?v={{.AppVersion}}';
    measurePageLoadTime({
      targetId: 'load-info',
      precision: 6,
      onComplete: (time) => console.log("Load Time:", time + "s")
    });
  </script>
</footer>
<script type="module">
  import { initNotificationBadge } from "/assets/js/notificationUtils.js?v={{.AppVersion}}";
  initNotificationBadge();
</script>
</body>
</html>
