<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Module 0 - ADMINISTRATOR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/assets/css/bootstrap.min.css?v={{.AppVersion}}">
  <link rel="stylesheet" href="/assets/css/custom/modules/module0/index.css?v={{.AppVersion}}">
  <link rel="shortcut icon" href="/assets/images/headerLogo.png" />

</head>
<body>
  

<!-- HEADER -->
<header class="bg-danger text-white py-3 shadow-sm">
  <div class="container d-flex justify-content-between align-items-center">
    <h1 class="h4 mb-0">M0 - Administrator</h1>
    <a href="/main" class="btn btn-outline-light btn-sm">← Go Back</a>
  </div>
</header>

<main class="container d-flex align-items-center justify-content-center" style="min-height: 70vh;">
  <div class="row row-cols-1 row-cols-md-3 g-4 justify-content-center">
    
    <div class="col">
      <div class="card bg-dark text-light h-100 shadow">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">Manage Users</h5>
          <p class="card-text small">Create, modify or delete users.</p>
          <a href="/module/gui/module0/users.html" class="btn btn-outline-light mt-auto">Go</a>
        </div>
      </div>
    </div>

    <div class="col">
      <div class="card bg-dark text-light h-100 shadow">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">Manage Logs</h5>
          <p class="card-text small">View logs and validate logchain</p>
          <a href="/module/gui/module0/logs.html" class="btn btn-outline-light mt-auto">Go</a>
        </div>
      </div>
    </div>

    <div class="col">
      <div class="card bg-dark text-light h-100 shadow">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">Manage Modules</h5>
          <p class="card-text small">View and control modules state</p>
          <a href="/module/gui/module0/modules.html" class="btn btn-outline-light mt-auto">Go</a>
        </div>
      </div>
    </div>

  </div>
</main>

  <!-- FOOTER -->
  <footer class="bg-danger text-light py-3 mt-4">
    <div class="container d-flex justify-content-between align-items-center small">
      <span>&copy; 2026 - <a class="text-white text-decoration-none" href="https://www.crm.cat">Centre de Recerca Matemàtica</a></span>
      <span id="load-info">Calculating load time...</span>
    </div>
  </footer>

  <!-- JS -->
  <script type="module">
      import { measurePageLoadTime } from '/assets/js/checkLoadTime.js?v={{.AppVersion}}';

      measurePageLoadTime({
        targetId: 'load-info',
        precision: 6,
      onComplete: (time) => console.log("Load Time:", time + "s")
      });
  </script>
</body>
</html>
