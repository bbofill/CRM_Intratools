<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Module 0 - ADMINISTRATOR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/assets/css/bootstrap.min.css?v={{.AppVersion}}">
  <link rel="stylesheet" href="/assets/css/custom/modules/module0/logs.css?v={{.AppVersion}}">
  <link rel="shortcut icon" href="/assets/images/headerLogo.png" />
</head>
<body>

<!-- HEADER -->
<header class="bg-danger text-white py-3 shadow-sm">
  <div class="container d-flex justify-content-between align-items-center">
    <h1 class="h4 mb-0">M0 - Administrator - Logs</h1>
    <a href="/module/gui/module0/" class="btn btn-outline-light btn-sm">← Go Back</a>
  </div>
</header>

<!-- MAIN -->
<main class="text-center my-4">
  <div class="mb-3">
    <button id="btn-validate" class="btn btn-outline-light btn-sm" style="width: 80%; max-width: 800px;">🔒 Validate Chain</button>
  </div>
  <div id="chain-status" class="mt-3 small text-info">waiting for validation...</div>
  <br>
  <div class="table-responsive" style="width: 80%; margin: 0 auto;">
    <table class="table table-dark table-striped table-bordered table-sm align-middle text-center">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Module</th>
          <th>Timestamp</th>
          <th>Message</th>
          <th>Code</th>
          <th>Hash</th>
          <th>Previous Hash</th>
        </tr>
      </thead>
      <tbody id="log-table-body">
        <tr><td colspan="7" class="text-center text-muted">Loading logs...</td></tr>
      </tbody>
    </table>
    <div class="d-flex justify-content-center align-items-center gap-3 mt-3">
      <button id="btn-prev-page" class="btn btn-outline-light btn-sm" disabled>← Previous</button>
      <span id="page-info" class="small text-light">Page 1</span>
      <button id="btn-next-page" class="btn btn-outline-light btn-sm">Next →</button>
    </div>
  </div>


  <br><br><br>
</main>

<!-- FOOTER -->
<footer class="bg-danger text-light py-3 mt-4">
  <div class="container d-flex justify-content-between align-items-center small">
    <span>&copy; 2026 - <a class="text-white text-decoration-none" href="https://www.crm.cat">Centre de Recerca Matemàtica</a></span>
    <span id="load-info">Calculating load time...</span>
  </div>
</footer>

<script type="module">
  import { measurePageLoadTime } from '/assets/js/checkLoadTime.js?v={{.AppVersion}}';
  import { loadLogsTable, validateLogChain, setupLogsPagination } from '/assets/js/modules/module0/logs_view.js?v={{.AppVersion}}';

  measurePageLoadTime({
    targetId: 'load-info',
    precision: 6,
    onComplete: (time) => console.log("Load Time:", time + "s")
  });

  setupLogsPagination();
  loadLogsTable();

  document.getElementById("btn-validate").addEventListener("click", validateLogChain);
</script>
</body>
</html>
