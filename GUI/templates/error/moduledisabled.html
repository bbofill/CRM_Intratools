<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Module Error - Session Terminated</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="/assets/css/custom/templates/moduledisabled.css">
  <link rel="shortcut icon" href="/assets/images/headerLogo.png" />
</head>

<style>
  :root {
    --bg-main: #1a1a1a;
    --grad-1: #400000;
    --grad-2: #1a1a1a;
  }
  body {
    background: radial-gradient(circle at top left, var(--grad-1), var(--grad-2));
    color: white;
    font-family: "Segoe UI", Tahoma, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  main {
    flex-grow: 1;
    padding: 1rem;
  }
  footer {
    position: fixed;
    bottom: 0;
    width: 100%;
  }

</style>

<body>

<!-- HEADER -->
<header class="bg-danger text-white py-3 shadow-sm">
  <div class="container d-flex justify-content-between align-items-center">
    <h1 class="h4 mb-0">M0 - Administrator - Error</h1>
    <a href="/" class="btn btn-outline-light btn-sm">← Go Home</a>
  </div>
</header>

<!-- MAIN -->
<main class="container text-center my-5">
  <div class="alert alert-danger shadow-sm py-4">
    <h2 class="mb-3">Module Not Enabled</h2>
    <p class="mb-2">For security reasons, your session has been terminated.</p>
    <p>Please log in again to continue.</p>
    <p class="text-muted mt-4">You will be automatically redirected to the homepage in <strong><span id="counter"></span></strong> seconds.</p>
  </div>
</main>

<!-- FOOTER -->
<footer class="bg-danger text-light py-3 mt-4">
  <div class="container d-flex justify-content-between align-items-center small">
    <span>&copy; 2026 - <a class="text-white text-decoration-none" href="https://www.crm.cat">Centre de Recerca Matemàtica</a></span>
  </div>
</footer>

<!-- JS -->
<script>
  var counter = 4;
  var countdown = setInterval(function() {
    document.getElementById('counter').innerHTML = counter;
    counter--;
    if (counter < 0) {
      clearInterval(countdown);
    }
  }, 1000);
</script>
<script>setTimeout(() => {
  window.location.href = "/";
}, 5000);
</script>
</body>
</html>
