<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRMIntratools - Main Panel</title>

  <link rel="stylesheet" href="/assets/css/tutorialStyles.css?v={{.AppVersion}}">
  <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="/assets/css/custom/templates/main.css?v={{.AppVersion}}">
  <link rel="shortcut icon" href="/assets/images/headerLogo.png" />
</head>

<body>
  <header class="py-3">
    <div class="container d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center">
        <a href="/main">
          <img id="logo" src="/assets/images/logo.png" alt="Logo CRMIntratools">
        </a>
        <span class="brand-version">v1.6</span>
      </div>

      <div class="d-flex align-items-center ms-3 header-actions">
        <a href="/module/gui/module3/notifications.html" class="position-relative notif-link">
          <img id="notif" src="/assets/images/bell.png" alt="Notifications">
          <span id="notif-count"
            class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
          </span>
        </a>

        <button id="helpBtn" class="help-btn" title="Reset tutorial" aria-label="Reset tutorial">?</button>
        <a href="/logout" class="btn btn-outline-dark btn-sm">Logout</a>
      </div>
    </div>
  </header>

  <div class="main-wrapper">
    <main class="page-shell">
    <section class="hero-panel">
      <div class="hero-main">
        <h1 class="hero-title">
          Welcome back, <span class="hero-name">{{.NAME}} {{.SURNAME}}</span>
        </h1>
      </div>

      <div class="hero-side">
        <div class="hero-side-card">
          <div class="hero-side-label">Permission level</div>
          <div class="hero-side-value role">{{.ROLE}}</div>
        </div>
      </div>
    </section>

      <section class="toolbar-card">
        <div class="d-flex flex-column flex-lg-row align-items-stretch align-items-lg-center gap-3">
          <div class="search-wrap">
            <input
              type="text"
              id="searchInput"
              placeholder="Search modules, tools, or features..."
              class="form-control"
              aria-label="Search Module"
            />
          </div>

          <div class="filter-buttons btn-group" role="group" aria-label="Category Filters">
            <button type="button" class="btn btn-outline-danger btn-sm" data-filter="cat1">ADMIN</button>
            <button type="button" class="btn btn-outline-primary btn-sm" data-filter="cat2">MANAGER</button>
            <button type="button" class="btn btn-outline-warning btn-sm" data-filter="cat4">SUPPORT</button>
            <button type="button" class="btn btn-outline-success btn-sm" data-filter="cat3">USER</button>
            <button type="button" class="btn btn-outline-secondary btn-sm" data-filter="cat5">GUEST</button>
            <button type="button" class="btn btn-danger btn-sm active" data-filter="all">ALL</button>
          </div>
        </div>
      </section>

      <div id="modulesContainer" class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xxl-4 g-3"></div>

      {{if or (eq .ROLE "admin") (eq .ROLE "manager")}}
      <div class="documentation-card">
        <a href="/documentation/" class="btn btn-danger">Documentation [ES]</a>
      </div>
      {{end}}
    </main>
  </div>

  <div id="resetTutorialsModal" class="modal" style="display:none;">
    <div class="modal-content">
      <h4>Do you want to reset all Intratools tutorials?</h4>
      <div class="modal-buttons">
        <button id="resetTutorialsYes" class="btn btn-danger">Yes</button>
        <button id="resetTutorialsNo" class="btn btn-secondary">No</button>
      </div>
    </div>
  </div>

  <footer class="bg-danger text-light py-3">
    <div class="container d-flex justify-content-between align-items-center small">
      <span>&copy; 2026 - <a class="text-white text-decoration-none" href="https://www.crm.cat">Centre de Recerca Matemàtica</a></span>
      <span id="load-info">Calculating load time...</span>
    </div>
  </footer>
  <script>
    window.APP_VERSION = "{{.AppVersion}}";
  </script>
  <script>
  const modules = [
      { id: "M0", title: 'Administrator', desc: 'Administrator Module; create users, view logs, control module state', href: '/module/gui/module0/', cat: 'cat1' },
      { id: "M1", title: 'Room Reservation', desc: 'Book offices, classrooms and auditoriums. Manage your reservations', href: '/module/gui/module1/', cat: 'cat3' },
      { id: "M2", title: 'Hot Desks', desc: 'Book a desk and manage your reservations', href: '/module/gui/module2/', cat: 'cat5' },
      { id: "M3", title: 'Profile', desc: 'Visualize your personal data', href: '/module/gui/module3/', cat: 'cat5' },
      { id: "M4", title: 'Manage data', desc: 'Create new users, make annuncements, add data', href: '/module/gui/module4/', cat: 'cat2' },
      { id: "M5", title: 'Data utilization', desc: 'Export data in different formats', href: '/module/gui/module5/', cat: 'cat2' },
      { id: "M6", title: 'Ticketing', desc: 'Send tickets to receive help from maintenance and IT', href: '/module/gui/module6/', cat: 'cat3' },
      { id: "M7", title: 'Distribution lists', desc: 'Manage email distribution groups and send targeted notifications to specific audiences', href: '/module/gui/module7/', cat: 'cat4' },
      { id: "M8", title: 'Budgeting', desc: 'Submit requests for travel budgets, equipment, and related resources.', href: '/module/gui/module8/', cat: 'cat3' },
      { id: "M9", title: 'Document viewer', desc: 'Consult official documents from the center', href: '/module/gui/module9/', cat: 'cat3' },
      { id: "M10", title: 'Service Comissions', desc: 'Submit your travel related expenses after a work trip', href: '/module/gui/module10/', cat: 'cat2' },
      { id: "M11", title: 'IT Tools', desc: 'Budget generator', href: '/module/gui/module11/', cat: 'cat1' }
    ];

    const roleLevels = {
      admin: 0,
      manager: 1,
      support: 2,
      user: 3,
      guest: 4
    };

    const categoryToRoleLevel = {
      cat1: 0,
      cat2: 1,
      cat4: 2,
      cat3: 3,
      cat5: 4
    };

    const currentUserRole = '{{.ROLE}}'.toLowerCase();
    const currentUserLevel = roleLevels[currentUserRole];

    const modulesContainer = document.getElementById('modulesContainer');
    const searchInput = document.getElementById('searchInput');
    const filterButtons = document.querySelectorAll('[data-filter]');

    filterButtons.forEach(btn => {
      const filter = btn.getAttribute('data-filter');
      if (filter !== 'all' && categoryToRoleLevel[filter] < currentUserLevel) {
        btn.style.display = 'none';
      }
    });

    renderModules();

    searchInput.addEventListener('input', renderModules);
    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelector('.filter-buttons .active')?.classList.remove('active');
        btn.classList.add('active');
        renderModules();
      });
    });

    function renderModules() {
      const term = searchInput.value.trim().toLowerCase();
      const activeFilter = document.querySelector('.filter-buttons .active').dataset.filter;
      modulesContainer.innerHTML = '';
      const fragment = document.createDocumentFragment();

      modules.filter(m => {
        const moduleLevel = categoryToRoleLevel[m.cat];
        const matchesRole = moduleLevel >= currentUserLevel;
        const matchesCat = activeFilter === 'all' || m.cat === activeFilter;
        const matchesTerm = m.title.toLowerCase().includes(term) || m.desc.toLowerCase().includes(term);
        return matchesRole && matchesCat && matchesTerm;
      }).forEach((m, index) => {
        const col = document.createElement('div');
        col.className = `col module ${m.cat}`;
        col.setAttribute("data-module-id", m.id);
        col.setAttribute("data-module-index", index);
        col.innerHTML = `
          <div class="card module-card ${m.cat} h-100">
            <div class="card-body d-flex flex-column">
              <div class="flex-grow-1">
                <h5 class="card-title text-capitalize">${m.title}</h5>
                <p class="card-text small">${m.desc}</p>
              </div>
              <a href="${m.href}" class="btn btn-danger mt-3 w-100">Open</a>
            </div>
          </div>`;
        fragment.appendChild(col);
      });

      modulesContainer.appendChild(fragment);

      if (!modulesContainer.children.length) {
        modulesContainer.innerHTML = '<p class="text-center opacity-75 w-100">No module found...</p>';
      }
    }

    document.getElementById("helpBtn").addEventListener("click", () => {
      document.getElementById("resetTutorialsModal").style.display = "flex";
    });

    document.getElementById("resetTutorialsNo").addEventListener("click", () => {
      document.getElementById("resetTutorialsModal").style.display = "none";
    });

    document.getElementById("resetTutorialsYes").addEventListener("click", async () => {
      document.getElementById("resetTutorialsModal").style.display = "none";

      const res = await fetch("/api/tutorial/reset", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "resetTutorials"
        })
      });

      if (res.ok) {
        location.reload();
      } else {
        alert("Error while resetting your tutorials.");
      }
    });
  </script>

  <script type="module">
    import { initNotificationBadge } from "/assets/js/notificationUtils.js?v={{.AppVersion}}";
    initNotificationBadge();
  </script>

  <script type="module">
    import { measurePageLoadTime } from '/assets/js/checkLoadTime.js?v={{.AppVersion}}';
    measurePageLoadTime({
      targetId: 'load-info',
      precision: 6,
      onComplete: (time) => console.log("Load Time:", time + "s")
    });
  </script>

  <script type="module" src="/assets/js/tutorials/tutorial_main.js?v={{.AppVersion}}"></script>
</body>
</html>
