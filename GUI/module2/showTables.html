<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>CRMIntratools - Hot Desks</title>
  <link rel="stylesheet" href="/assets/css/tutorialStyles.css?v={{.AppVersion}}">
  <link rel="stylesheet" href="/assets/css/bootstrap.min.css?v={{.AppVersion}}"> 
  <link rel="stylesheet" href="assets/style.css?v={{.AppVersion}}">
  <link rel="shortcut icon" href="/assets/images/headerLogo.png" />
</head>

<body>
<!-- HEADER -->
<header class="bg-light shadow-sm">
  <div class="container d-flex justify-content-between align-items-center">
    <a href="/main">
      <img id="logo" src="assets/images/logo.png" alt="Logo CRMIntratools">
    </a>
          <div class="d-flex align-items-center gap-4 ms-3">
        <a href="/module/gui/module3/notifications.html" class="position-relative">
          <img src="/assets/images/bell.png" alt="Notifications" style="width: 30px;">
          <span id="notif-count"
                class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
          </span>
        </a>
    <a href="index.html" class="btn btn-outline-secondary">← Go back</a>
  </div>
  </div>
</header>

<!-- CONTENIDO -->
<div id="page-container">
  <div class="container">
    <h2 class="text-danger">Available desks</h2>
    <div class="table-responsive"></div>
    <table id="mesasTable" class="table text-center align-middle table-hover">
      <thead class="table-danger">
        <tr>
          <th>ID</th>
          <th>Capacity</th>
          <th>Floor</th>
          <th>Start Time</th>
          <th>End Time</th>
          <th></th>
        </tr>
      </thead>
      <tbody class="table-active"></tbody>
    </table>
    </div>
  </div>
</div>

<!-- SCRIPT -->
<script>
  const mesasJSON = sessionStorage.getItem("mesasDisponibles");
  const tbody = document.querySelector("#mesasTable tbody");

  if (!mesasJSON) {
    tbody.innerHTML = "<tr><td colspan='6'>No available data.</td></tr>";
  } else {
    const datos = JSON.parse(mesasJSON);

    if (!datos.mesas || datos.mesas.length === 0) {
      tbody.innerHTML = "<tr><td colspan='6'>No available tables on this floor.</td></tr>";
    } else {
      datos.mesas.forEach(m => {
        const fila = document.createElement("tr");
        const start = new Date(datos.startTime);
        const end = new Date(datos.endTime);

        function formatDateTime(date) {
          const day = `${date.getDate()}`.padStart(2, "0");
          const month = `${date.getMonth() + 1}`.padStart(2, "0");
          const year = date.getFullYear();
          const hours = `${date.getHours()}`.padStart(2, "0");
          const minutes = `${date.getMinutes()}`.padStart(2, "0");
          return `${day}/${month}/${year} ${hours}:${minutes}`;
        }

        fila.innerHTML = `
          <td>${m.name}</td>
          <td>${m.capacity}</td>
          <td>${m.floor}</td>
          <td>${formatDateTime(start)}</td>
          <td>${formatDateTime(end)}</td>
          <td>
            <button class="btn btn-outline-danger reservar-btn" data-id="${m.id}">
              Book
            </button>
          </td>
        `;
        fila.querySelector(".reservar-btn").addEventListener("click", () => {
          const reserva = {
            id: m.id,
            name: m.name,
            position: m.position,
            capacity: datos.capacitySolicitada,
            floor: m.floor,
            startTime: datos.startTime,
            endTime: datos.endTime
          };
          sessionStorage.setItem("reservaSeleccionada", JSON.stringify(reserva));
          window.location.href = "confirmation.html";
        });
        tbody.appendChild(fila);
      });
    }
  }
</script>

<!-- FOOTER -->
<footer class="bg-danger text-light py-3">
  <div class="container d-flex justify-content-between align-items-center small">
    <span>&copy; 2026 - <a class="text-white text-decoration-none" href="https://www.crm.cat">Centre de Recerca Matemàtica</a></span>
    <span id="load-info">Calculating load time...</span>
  </div>
  <script type="module">
    import { measurePageLoadTime } from '/assets/js/checkLoadTime.js?v={{.AppVersion}}';

    measurePageLoadTime({
      targetId: 'load-info',
      precision: 6,
      onComplete: (time) => console.log("Load Time:", time + "s")
    });
  </script>
</footer>
<script type="module">
  import { initNotificationBadge } from "/assets/js/notificationUtils.js?v={{.AppVersion}}";
  initNotificationBadge();
</script>
<script type="module" src="/assets/js/tutorials/tutorial_module2.js?v={{.AppVersion}}"></script>
</body>
</html>
