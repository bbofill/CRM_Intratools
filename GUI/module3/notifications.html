<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CRMIntratools - Notifications</title>
  <link rel="stylesheet" href="/assets/css/bootstrap.min.css?v={{.AppVersion}}">
  <link rel="stylesheet" href="assets/style.css?v={{.AppVersion}}">
  <link rel="shortcut icon" href="/assets/images/headerLogo.png" />
</head>

<body>
<header class="bg-light">
  <div class="container d-flex justify-content-between align-items-center">
    <a href="/main">
      <img id="logo" src="assets/images/logo.png" alt="Logo CRMIntratools">
    </a>
    <a href="javascript:history.back()"  class="btn btn-outline-secondary">← Go back</a>
  </div>
</header>

<div id="page-container">
  <div class="container">
    <div class="notifications-shell">
      <div class="notifications-header">
        <h2>Notifications</h2>
        <button id="view-sent-btn" class="btn btn-outline-secondary btn-sm">
          Sent notifications
        </button>
      </div>

      <div class="notifications-layout">
        <!-- Sidebar de notificaciones -->
        <div class="notification-sidebar">
          <ul class="list-group" id="notification-list"></ul>
        </div>

        <!-- Contenido de la notificación -->
        <div class="notification-detail" id="notification-content">
          <h4 id="notif-title"></h4>
          <p><small id="notif-date" class="text-muted"></small></p>
          <div class="d-flex justify-content-between align-items-center mb-3">
            <button id="notif-delete" class="btn btn-sm btn-outline-danger d-none">🗑️</button>
            <div id="notif-sender-info" class="d-flex align-items-center"></div>
          </div>
          <pre id="notif-body" class="bg-light p-3 mt-3 d-none"></pre>
          <div id="notif-preview" class="mt-3"></div>
          <a id="notif-download" href="#" class="btn btn-sm btn-danger d-none" target="_blank">Download attachment</a>
        </div>
      </div>
    </div>
  </div>
</div>

<footer class="bg-danger text-light py-3 mt-4">
    <div class="container d-flex justify-content-between align-items-center small">
      <span>&copy; 2026 - <a class="text-white text-decoration-none" href="https://www.crm.cat">Centre de Recerca Matemàtica</a></span>
      <span id="load-info">Calculating load time...</span>
    </div>
    <script type="module">
      import { measurePageLoadTime } from '/assets/js/checkLoadTime.js?v={{.AppVersion}}';
      measurePageLoadTime({
        targetId: 'load-info',
        precision: 6,
        onComplete: (time) => console.log("Load Time:", time + "s")
      });
    </script>
  </footer>

<script src="/assets/js/bootstrap.bundle.min.js?v={{.AppVersion}}"></script>
<script type="module">
  import { loadNotifications, setupNotificationInteraction, loadSentNotifications } from "./assets/js/notifications.js?v={{.AppVersion}}";

  window.addEventListener("DOMContentLoaded", async () => {
    await loadNotifications();
    setupNotificationInteraction();
  });

  document.getElementById("view-sent-btn").addEventListener("click", async () => {
    await loadSentNotifications();
  });

</script>

</body>
</html>
