<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>CRMIntratools - Export data</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/assets/css/bootstrap.min.css?v={{.AppVersion}}">
  <link rel="stylesheet" href="assets/style.css?v={{.AppVersion}}">
  <link rel="shortcut icon" href="/assets/images/headerLogo.png" />
</head>
<body>
<!-- HEADER -->
<header class="bg-light">
    <div class="container d-flex justify-content-between align-items-center">
      <a href="/main">
        <img id="logo" src="assets/images/logo.png" alt="Logo CRMIntratools">
      </a>
      <a href="./configuration.html" id="configBtn" class="help-btn">⚙️</a>
      <div class="d-flex align-items-center gap-4 ms-3">
        <a href="/module/gui/module3/notifications.html" class="position-relative">
          <img src="/assets/images/bell.png" alt="Notifications" style="width: 30px;">
          <span id="notif-count"
                class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
          </span>
        </a>
      <a href="/main" class="btn btn-outline-secondary">← Go back</a>
    </div>
    </div>
  </header>

<main class="container">
  <div id="page-container">
  <div class="container">

  <div class="row row-cols-1 row-cols-md-7 g-4 justify-content-center">
    
    <div class="col">
      <div class="card bg-dark text-light h-100 shadow">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title fs-4">Employee data extraction</h5>
          <p class="card-text small">Visualize workers' data</p>
          <a href="/module/gui/module5/employeeExport.html" class="btn btn-outline-light mt-auto">Go</a>

        </div>
      </div>
    </div>

    <div class="col">
      <div class="card bg-dark text-light h-100 shadow">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title fs-4">Uneix data extraction</h5>
          <p class="card-text small">Get .csv files</p>
          <!--<a href="" class="btn btn-outline-light mt-auto">Disabled</a>-->
          <a href="/module/gui/module5/uneixIndex.html" class="btn btn-outline-light mt-auto">Go</a>
        </div>
      </div>
    </div>



  </div>
  </div>
  </div>
</main>

  <!-- FOOTER -->
  <footer class="bg-danger text-light py-3 mt-4">
    <div class="container d-flex justify-content-between align-items-center small">
      <span>&copy; 2026 - <a class="text-white text-decoration-none" href="https://www.crm.cat">Centre de Recerca Matemàtica</a></span>
      <span id="load-info">Calculating load time...</span>
    </div>
  </footer>

  <!-- JS -->
  <script type="module">
      import { measurePageLoadTime } from '/assets/js/checkLoadTime.js?v={{.AppVersion}}';

      measurePageLoadTime({
        targetId: 'load-info',
        precision: 6,
      onComplete: (time) => console.log("Load Time:", time + "s")
      });
  </script>
  <script>
    let userRole = null;

  
    window.addEventListener("DOMContentLoaded", () => {
      
      fetch('/module/proxy/module5/api?action=checkRole', {
        method: 'GET',
        headers: { 'Content-Type': 'application/json' }
      })
      .then(response => response.json())
      .then(data => {
        const userRole = data.role;
        if (userRole !== "admin") {
          document.getElementById("configBtn").style.display = "none";
        }
      });

    });
  </script>
<script type="module">
  import { initNotificationBadge } from "/assets/js/notificationUtils.js?v={{.AppVersion}}";
  initNotificationBadge();
</script>
</body>
</html>
